.overlay.keyboard-visible{align-items:flex-start}.overlay.keyboard-visible .modal{max-height:calc(100dvh - 24px)}
.number-trigger{width:100%;text-align:left;min-height:46px;background:#e6f0ea;border:1px solid #d5e6db;font-weight:650}
.keypad-overlay{position:fixed;inset:0;z-index:60;background:#142c2970;display:flex;align-items:center;justify-content:center;padding:18px}
.keypad-dialog{width:min(100%,340px);background:#faf9f5;border-radius:25px;padding:18px;box-shadow:0 15px 45px #0003}
.keypad-dialog .numdisplay{background:#edf3ee;border-radius:14px;margin:10px 0 13px;padding:12px;font-size:31px}
.keypad-dialog .numgrid{gap:9px}.keypad-dialog .numgrid button{height:54px;border-radius:13px;font-size:24px}
.overlay{padding:12px;align-items:center}.modal{max-height:min(82dvh,720px);overscroll-behavior:contain;scrollbar-width:thin}

.tile.menu img{object-fit:cover!important;object-position:center center;background:#d9eaf1}

.routine-progress{width:60px;height:60px;flex:0 0 60px;border-radius:50%;padding:5px;background:conic-gradient(var(--progress-color,#7fa985) var(--pct),#dce8e2 var(--pct));display:grid;place-items:center;box-shadow:0 1px 4px #173f3411}

.routine-progress-inner span{font-size:24px;color:#3d7165}
.routine-row{min-height:76px;gap:10px}
.routine-ideas{display:flex;flex-wrap:wrap;gap:7px}
.idea-pill{border-radius:18px;background:#e8f1eb;color:#23463e;padding:7px 10px;font-size:12px}

 fab('addWine()');const count=db.wines.reduce((sum,w)=>sum+Number(w.qty||0),0);
 return `<div class="chips wine-tabs">${['Tous','Rouge','Blanc','Rosé','Effervescent','Autre'].map(c=>`<button class="chip ${(!tab&&c==='Tous')||tab===c?'active':''}" onclick="setTab('${c}')">${c}</button>`).join('')}</div><div class="wine-summary"><span>${count} bouteille(s) · ${db.wines.length} référence(s)</span><button class="softbtn" onclick="manageWinePlaces()">Lieux de stockage</button></div>${wines.length?wines.map(w=>`<div class="line"><span class="wine-bottle">${wineBottle(w.color)}</span><div class="grow" onclick="editWine('${w.id}')"><div class="name">${esc(w.name)}</div><div class="tiny">${esc([w.color,w.year].filter(Boolean).join(' · '))}</div><div class="tiny">${esc([w.region,w.place].filter(Boolean).join(' · '))}</div></div><button class="iconbtn" onclick="adjustWine('${w.id}',-1)">−</button><span class="stockqty">${Number(w.qty)||0}<div class="tiny">btl.</div></span><button class="iconbtn" onclick="adjustWine('${w.id}',1)">+</button></div>`).join(''):blank('Aucun vin ici. Appuie sur + pour en ajouter.')}`;
}
function winePlaceSelect(place){return `<label class="field">Lieu de stockage<select name="place" id="wine-place-select">${db.winePlaces.map(x=>`<option value="${esc(x)}" ${x===place?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="softbtn" type="button" onclick="addWinePlaceInline()">+ Ajouter un lieu</button>`}
function addWinePlaceInline(){const name=prompt('Nom du nouvel emplacement (ex. Cave de maman)');if(!name||!name.trim())return;const v=name.trim();if(!db.winePlaces.includes(v))db.winePlaces.push(v);save();const el=document.getElementById('wine-place-select');if(el){el.add(new Option(v,v));el.value=v}}
function manageWinePlaces(){openModal('Lieux de stockage',`<div class="wine-place-list">${db.winePlaces.map((x,i)=>`<div class="line"><span class="grow">${esc(x)}</span><button type="button" class="iconbtn" onclick="renameWinePlace(${i})">✎</button><button type="button" class="iconbtn" onclick="deleteWinePlace(${i})">×</button></div>`).join('')}</div><button type="button" class="softbtn" onclick="addWinePlaceFromManager()">+ Ajouter un lieu</button>`,()=>{closeModal();update()})}
function addWinePlaceFromManager(){const n=prompt('Nom du nouvel emplacement');if(!n?.trim())return;if(!db.winePlaces.includes(n.trim()))db.winePlaces.push(n.trim());save();manageWinePlaces()}
function renameWinePlace(i){const old=db.winePlaces[i];const n=prompt('Renommer cet emplacement',old);if(!n?.trim())return;db.winePlaces[i]=n.trim();db.wines.forEach(w=>{if(w.place===old)w.place=n.trim()});save();manageWinePlaces()}
function deleteWinePlace(i){const old=db.winePlaces[i];if(db.wines.some(w=>w.place===old)){showToast('Déplace d’abord les vins de cet emplacement');return}if(db.winePlaces.length<=1){showToast('Garde au moins un emplacement');return}db.winePlaces.splice(i,1);save();manageWinePlaces()}
function wineFields(w={}){return field('name','Nom du vin',w.name||'','text','required')+select('color','Couleur',['Rouge','Blanc','Rosé','Effervescent','Autre'],w.color||'Rouge')+field('year','Millésime',w.year||'','number','min="1900" max="2100"')+field('region','Région / appellation',w.region||'')+winePlaceSelect(w.place||db.winePlaces[0])+numInput('qty','Nombre de bouteilles',w.qty??1)+area('notes','Notes (facultatif)',w.notes||'')}
function addWine(){openModal('Ajouter un vin',wineFields(),v=>{if(!v.name.trim())return;db.wines.push({id:uid(),name:v.name.trim(),color:v.color,region:v.region,year:v.year,qty:Math.max(0,Number(v.qty)||0),place:v.place,notes:v.notes});closeModal();update()})}
function editWine(id){let w=db.wines.find(x=>x.id===id);if(!w)return;openModal('Modifier le vin',wineFields(w)+`<button type="button" class="softbtn" onclick="removeWine('${id}')">Supprimer ce vin</button>`,v=>{Object.assign(w,{name:v.name.trim(),color:v.color,region:v.region,year:v.year,qty:Math.max(0,Number(v.qty)||0),place:v.place,notes:v.notes});closeModal();update()})}
function adjustWine(id,n){let w=db.wines.find(x=>x.id===id);if(!w)return;w.qty=Math.max(0,(Number(w.qty)||0)+n);update()}
function removeWine(id){db.wines=db.wines.filter(x=>x.id!==id);closeModal();update()}
function homeView(){let due=db.routines.filter(r=>routineRemaining(r)<0).length,exp=db.stocks.filter(s=>s.expiry&&daysUntil(s.expiry)<=(s.kind==='meds'?30:3)).length,need=db.shopping.filter(s=>!s.done).length,task=db.tasks.filter(s=>!s.done).length;let alerts=[['routines','Routines',due,'en retard'],['tasks','Tâches',task,'à faire'],['courses','Courses',need,'à acheter'],['fridge','Péremptions',exp,'à surveiller']].filter(x=>x[2]>0);return `<div class="muted" style="margin:3px 0 14px">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>${alerts.length?`<div class="summary">${alerts.map(([k,label,n,detail])=>`<button class="sum" onclick="navigate('${k}')">${label}<strong>${n} ${detail}</strong></button>`).join('')}</div>`:''}<button class="medrem-home" onclick="navigate('medrem')"><span class="medrem-symbol">✚</span><span><strong>Rappel médicaments</strong><small>${(db.medReminders||[]).length} rappel(s) quotidien(s)</small></span><span class="medrem-chevron">›</span></button><div class="grid" id="tilegrid">${db.order.filter(k=>MODS.some(m=>m[0]===k)).map(k=>`<button class="tile ${k==='menu'?'menu':''}" draggable="true" data-key="${k}" onclick="navigate('${k}')"><span class="tile-label">${esc(MODS.find(m=>m[0]===k)[1])}</span></button>`).join('')}</div>`}
function shoppingView(){if(!tab)tab=db.lists[0]||'Supermarché';let items=db.shopping.filter(s=>tab==='Toutes'||s.list===tab),pending=items.filter(s=>!s.done).sort((a,b)=>(a.category||'Autre').localeCompare(b.category||'Autre')||a.name.localeCompare(b.name)),done=items.filter(s=>s.done);fab('addShopping()');return `<div class="row space">${tabs([...db.lists,'Toutes'],tab,'setTab')}<button class="iconbtn" onclick="newList()" title="Nouvelle liste">+</button></div>${pending.length?pending.map(s=>shoppingLine(s)).join(''):blank('Ta liste est vide. Appuie sur + pour ajouter un produit.')}<details><summary>Articles achetés (${done.length})</summary>${done.map(shoppingLine).join('')}</details>`}
function shoppingLine(s){return `<div class="line"> <input class="check" type="checkbox" ${s.done?'checked':''} onchange="changeShopping('${s.id}',this.checked)">${picture(s)}<div class="grow" onclick="editShopping('${s.id}')"><div class="name" style="${s.done?'text-decoration:line-through;opacity:.55':''}">${esc(s.name)}</div><div class="tiny">${esc(s.qty)} ${esc(s.unit||'unité(s)')}</div></div><button class="iconbtn" title="${s.done?'Remettre dans les courses':'Modifier'}" aria-label="${s.done?'Remettre dans les courses':'Modifier'}" onclick="${s.done?`restoreShopping('${s.id}')`:`editShopping('${s.id}')`}">${s.done?'🛒':'⋯'}</button></div>`}function restoreShopping(id){let item=db.shopping.find(x=>x.id===id);if(!item)return;item.done=false;update();showToast('Remis dans la liste de courses')}function changeShopping(id,done){let s=db.shopping.find(x=>x.id===id);s.done=done;update();if(done&&['fridge','meds','beauty','house'].includes(s.kind||'fridge'))showToast('Achat coché : rangement possible depuis Au frigo')}
function newList(){openModal('Nouvelle liste',field('name','Nom de la liste','','text','required'),v=>{if(!v.name.trim())return;db.lists.push(v.name.trim());tab=v.name.trim();closeModal();update()})}
function shoppingForm(s={}){return field('name','Produit',s.name||'','text','required')+`<div class="row" style="align-items:start"><div style="flex:1">${numInput('qty','Quantité',s.qty??1)}</div><div style="flex:1">${select('unit','Mesure',['unité(s)','g','kg','ml','L'],s.unit||'unité(s)')}</div></div>`+select('category','Catégorie',['Fruits et légumes','Frais','Épicerie','Surgelés','Boissons','Hygiène','Maison','Pharmacie','Autre'],s.category||'Autre')}
function addShopping(){let target=tab==='Toutes'?db.lists[0]:tab;openModal('Ajouter un produit',shoppingForm(),v=>{db.shopping.push({id:uid(),name:v.name.trim(),qty:num(v.qty),unit:v.unit,category:v.category,list:target,done:false});closeModal();update()})}function editShopping(id){let s=db.shopping.find(x=>x.id===id);openModal('Modifier le produit',shoppingForm(s)+`<button type="button" class="softbtn" onclick="deleteShopping('${id}')">Supprimer le produit</button>`,v=>{Object.assign(s,{name:v.name,qty:num(v.qty),unit:v.unit,category:v.category});closeModal();update()})}function deleteShopping(id){db.shopping=db.shopping.filter(s=>s.id!==id);closeModal();update()}
function inventoryView(kind){let isFood=kind==='fridge';let options=isFood?['Frigo','Congélateur','Placards']:[];if(isFood&&!options.includes(tab))tab='Frigo';let a=db.stocks.filter(s=>s.kind===kind&&(!isFood||s.location===tab)).sort((a,b)=>a.name.localeCompare(b.name));fab(`addStock('${kind}')`);return `${isFood?tabs(options,tab,'setTab'):''}<div class="row space"><span class="muted">${a.length} produit(s) · ordre alphabétique</span>${isFood?btn('🛍 Ranger les achats',"transferShopping()") :''}</div>${a.length?a.map(s=>stockLine(s)).join(''):blank('Aucun produit pour le moment.')} ${isFood?`<div class="row" style="margin-top:18px;flex-wrap:wrap">${btn('▥ Scanner un code-barres','barcodeEntry()')}${btn('📷 Photographier mes courses','openPhotoShopping()')}</div>`:''}`}
function stockLine(s){let low=s.noThreshold!==true&&s.min!==null&&num(s.qty)<=num(s.min??1),exp=s.expiry&&daysUntil(s.expiry)<=(s.kind==='meds'?30:3);return `<div class="line">${picture(s)}<div class="grow" onclick="editStock('${s.id}')"><div class="name">${esc(s.name)}</div>${exp?`<div class="tiny warning">Péremption : ${pretty(s.expiry)}</div>`:''}</div><button class="iconbtn" onclick="adjustStock('${s.id}',-1)">−</button><span class="stockqty">${esc(s.qty)}<div class="tiny">${esc(s.unit||'u')}</div></span><button class="iconbtn" onclick="adjustStock('${s.id}',1)">+</button>${low?`<button class="iconbtn" title="Ajouter aux courses" onclick="toShopping('${s.id}')">🛒</button>`:''}</div>`}function adjustStock(id,n){let s=db.stocks.find(x=>x.id===id);s.qty=Math.max(0,num(s.qty)+n);update()}
function toShopping(id){let s=db.stocks.find(x=>x.id===id),list=(s.kind==='meds'?(db.lists.find(x=>/pharma|médic/i.test(x))||db.lists[0]):db.lists[0]);if(!db.shopping.some(x=>x.name.toLowerCase()===s.name.toLowerCase()&&!x.done)){db.shopping.push({id:uid(),name:s.name,qty:Math.max(1,num(s.min??1)-num(s.qty)),unit:s.unit||'unité(s)',category:s.category||'Autre',list,done:false})}update();showToast('Ajouté aux courses')}
function stockForm(s={},kind='fridge'){return field('name','Nom du produit',s.name||'','text','required')+`<div class="row" style="align-items:start"><div style="flex:1">${numInput('qty','Quantité',s.qty??1)}</div><div style="flex:1">${select('unit','Unité',kind==='meds'?['unité(s)','comprimé(s)','gélule(s)','sachet(s)','ampoule(s)','dose(s)','flacon(s)','boîte(s)','tube(s)','seringue(s)','pansement(s)','dispositif(s)','sirop (flacon)']:['unité(s)','g','kg','ml','L'],s.unit||'unité(s)')}</div></div>`+(kind==='fridge'?select('location','Rangement',['Frigo','Congélateur','Placards'],s.location||tab||'Frigo'):'')+`<label class="row" style="margin:14px 0"><input type="checkbox" name="noThreshold" ${s.noThreshold?'checked':''} onchange="document.getElementById('threshold-setting').hidden=this.checked"> Aucun seuil de rachat</label><div id="threshold-setting" ${s.noThreshold?'hidden':''}>${numInput('min',kind==='meds'?'Seuil de rachat':'Seuil pour le panier',s.min??1)}</div>`+((kind==='fridge'&&/^(fruits? et légumes?|épicerie|sucre|sel|farine|riz|pâtes|légumes|fruits)$/i.test(s.category||'')||kind==='fridge'&&/^(pomme|banane|carotte|tomate|salade|citron|oignon|ail|sucre|sel|riz|pâtes?|farine|poivre|courgette|patate|pomme de terre)s?$/i.test((s.name||'').trim()))?'':field('expiry','Date de péremption (facultatif)',s.expiry||'','date'))+field('barcode','Code-barres (facultatif)',s.barcode||'','text','inputmode="numeric"')+`<label class="field"><span>Photo (facultative)</span><input type="file" name="photoFile" accept="image/*" onchange="previewFile(this)"><img id="uploadpreview" class="photoPreview" style="display:none"></label>`}
let uploadedPhoto='';function previewFile(input){let file=input.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{uploadedPhoto=reader.result;let im=document.getElementById('uploadpreview');if(im){im.src=uploadedPhoto;im.style.display='block'}};reader.readAsDataURL(file)}
function noExpiryForProduct(name){return /\b(pomme|banane|carotte|tomate|salade|citron|oignon|ail|sucre|sel|riz|pâte|farine|poivre|courgette|pomme de terre|concombre|orange|poire|brocoli|haricot|aubergine|persil|basilic)\b/i.test(name||'')}
document.addEventListener('input',e=>{if(e.target?.matches('#entryform input[name=name]')&&document.querySelector('#entryform input[name=expiry]'))refreshStockExpiry()});
function refreshStockExpiry(){let f=document.getElementById('entryform');if(!f||!f.elements.name)return;let e=f.elements.expiry;if(e){let hide=noExpiryForProduct(f.elements.name.value);e.closest('label').hidden=hide;if(hide)e.value=''}}
function addStock(kind){uploadedPhoto='';openModal('Ajouter un produit',stockForm({},kind),v=>{let s={id:uid(),kind,name:v.name.trim(),qty:num(v.qty),unit:v.unit,location:v.location||'',min:v.noThreshold?null:num(v.min),noThreshold:!!v.noThreshold,expiry:v.expiry||'',barcode:v.barcode,photo:uploadedPhoto};db.stocks.push(s);if(v.barcode)db.codes[v.barcode]={name:s.name,kind,location:s.location};closeModal();update()})}function editStock(id){let s=db.stocks.find(x=>x.id===id);uploadedPhoto='';openModal('Modifier le produit',stockForm(s,s.kind)+`<button type="button" class="softbtn" onclick="removeStock('${id}')">Supprimer</button>`,v=>{Object.assign(s,{name:v.name,qty:num(v.qty),unit:v.unit,min:v.noThreshold?null:num(v.min),noThreshold:!!v.noThreshold,location:v.location||s.location,expiry:v.expiry,barcode:v.barcode,photo:uploadedPhoto||s.photo});if(v.barcode)db.codes[v.barcode]={name:s.name,kind:s.kind,location:s.location};closeModal();update()})}function removeStock(id){db.stocks=db.stocks.filter(s=>s.id!==id);closeModal();update()}
let barcodeStream=null,barcodeTimer=null;
function stopBarcodeCamera(){if(barcodeTimer){clearInterval(barcodeTimer);barcodeTimer=null}if(barcodeStream){barcodeStream.getTracks().forEach(t=>t.stop());barcodeStream=null}}
function barcodeEntry(){openModal('Scanner un code-barres',`<div class="muted">Place le code-barres devant l'appareil photo ou saisis son numéro.</div><button type="button" class="softbtn" onclick="startBarcodeCamera()">📷 Ouvrir l’appareil photo</button><div id="barcode-camera" style="margin:10px 0"></div>${field('barcode','Numéro du code-barres','','text','required inputmode="numeric"')}`,v=>resolveBarcode(v.barcode),'Continuer')}
function resolveBarcode(code){stopBarcodeCamera();let found=db.stocks.find(s=>s.barcode===code),known=db.codes[code];closeModal();if(found)editStock(found.id);else if(known)addStockPrefilled(known,code);else addStockPrefilled({kind:'fridge',location:tab||'Placards'},code)}
async function startBarcodeCamera(){const area=document.getElementById('barcode-camera');if(!area)return;if(!navigator.mediaDevices?.getUserMedia){area.textContent='L’accès à la caméra est bloqué depuis ce fichier local. Ouvre l’application en HTTPS pour scanner, ou saisis le numéro manuellement.';return}if(!('BarcodeDetector' in window)){area.textContent='La lecture automatique n’est pas disponible dans ce navigateur. Tu peux saisir le numéro manuellement.';return}try{barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=true;video.style.cssText='width:100%;max-height:230px;border-radius:14px;object-fit:cover';video.srcObject=barcodeStream;area.replaceChildren(video);await video.play();const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});barcodeTimer=setInterval(async()=>{if(video.readyState<2)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue;stopBarcodeCamera();const input=document.querySelector('#entryform [name=barcode]');if(input)input.value=code;area.textContent='Code détecté : '+code+' — appuie sur Continuer.'}}catch(e){}},350)}catch(e){stopBarcodeCamera();area.textContent='Caméra indisponible ou autorisation refusée. Saisis le numéro manuellement.'}}
function addStockPrefilled(p,code){uploadedPhoto='';openModal('Mémoriser le produit',stockForm({...p,barcode:code},p.kind||'fridge'),v=>{let s={id:uid(),kind:p.kind||'fridge',name:v.name,qty:num(v.qty),unit:v.unit,location:v.location||'',min:v.noThreshold?null:num(v.min),noThreshold:!!v.noThreshold,expiry:v.expiry||'',barcode:v.barcode,photo:uploadedPhoto};db.stocks.push(s);db.codes[v.barcode]={name:s.name,kind:s.kind,location:s.location};closeModal();update()})}
function transferShopping(){let bought=db.shopping.filter(s=>s.done&&!s.transferred);if(!bought.length){showToast('Aucun achat à ranger');return}openModal('Ranger mes achats',`<div class="muted">Sélectionne les produits à ajouter à ton inventaire.</div>${bought.map(s=>`<label class="line"><input class="check" type="checkbox" name="item-${s.id}" checked>${picture(s)}<span class="grow">${esc(s.name)} · ${esc(s.qty)} ${esc(s.unit||'u')}</span></label>`).join('')}`+select('location','Rangement',['Frigo','Congélateur','Placards'],tab||'Frigo'),v=>{bought.forEach(s=>{if(v['item-'+s.id]){let old=db.stocks.find(x=>x.kind==='fridge'&&x.location===v.location&&x.name.toLowerCase()===s.name.toLowerCase()&&x.unit===s.unit);if(old)old.qty+=num(s.qty);else db.stocks.push({id:uid(),kind:'fridge',location:v.location,name:s.name,qty:num(s.qty),unit:s.unit,min:1});s.transferred=true}});closeModal();update()},'Ranger')}
function showFavorites(){let fav=db.stocks.filter(s=>s.kind==='fridge');openModal('Produits habituels',fav.length?fav.map(s=>`<div class="line">${picture(s)}<div class="grow">${esc(s.name)}</div><button type="button" class="iconbtn" onclick="adjustStock('${s.id}',1);closeModal()">+</button></div>`).join(''):blank('Ajoute des produits à ton inventaire pour les retrouver ici.'),()=>closeModal(),'Fermer')}
function notesView(){fab('editNote()');let arr=db.notes.filter(n=>!tab||n.title.toLowerCase().includes(tab.toLowerCase())||n.text.toLowerCase().includes(tab.toLowerCase())).sort((a,b)=>Number(b.pin)-Number(a.pin));return `<input class="search" placeholder="Rechercher une note…" value="${esc(tab)}" oninput="tab=this.value;document.getElementById('notesarea').innerHTML=notesTiles()"><div id="notesarea">${notesTiles()}</div>`}function notesTiles(){let q=(tab||'').toLowerCase();let arr=db.notes.filter(n=>!q||(`${n.title||''} ${n.text||''}`).toLowerCase().includes(q)).sort((a,b)=>Number(b.pin)-Number(a.pin));return `<div class="notes-masonry" style="margin-top:14px">${arr.map(n=>`<div class="note" style="background:${n.color||'#f7e9d6'}"><button class="note-title" onclick="editNote('${n.id}')"><strong>${n.pin?'📌 ':''}${esc(n.title||'Note')}</strong></button>${n.checklist?`<div class="note-checks">${(n.text||'').split('\n').filter(Boolean).map((line,i)=>`<label class="note-check"><input type="checkbox" ${((n.checked||[]).includes(i))?'checked':''} onchange="toggleNoteItem('${n.id}',${i},this.checked)"><span>${esc(line)}</span></label>`).join('')}</div>`:`<button class="note-body" onclick="editNote('${n.id}')">${esc(n.text||'').slice(0,250)}</button>`}<button class="note-edit" onclick="editNote('${n.id}')">Modifier</button></div>`).join('')}</div>${arr.length?'':blank('Aucune note pour le moment.')}`}
function toggleNoteItem(id,i,checked){let n=db.notes.find(x=>x.id===id);if(!n)return;n.checked=n.checked||[];n.checked=checked?[...new Set([...n.checked,i])]:n.checked.filter(x=>x!==i);save()}
function switchNoteType(type){
 const checklist=type==='checklist';
 document.getElementById('note-check-editor').style.display=checklist?'block':'none';
 document.getElementById('note-text-editor').style.display=checklist?'none':'block';
 if(checklist&&!document.querySelector('#note-check-items .note-edit-row')){
 const source=document.querySelector('#note-text-editor textarea');
 const text=source?.value||document.getElementById('note-check-source').value||'';
 text.split('\\n').filter(Boolean).forEach(t=>addNoteCheckRow(t));
 if(!text.trim())addNoteCheckRow();
 }
}
function addNoteCheckRow(text=''){
 const area=document.getElementById('note-check-items');if(!area)return;
 const row=document.createElement('div');row.className='note-edit-row';
 const check=document.createElement('input');check.type='checkbox';check.disabled=true;
 const input=document.createElement('input');input.type='text';input.placeholder='Élément de la liste';input.value=text;
 const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.className='softbtn';remove.onclick=()=>row.remove();
 row.append(check,input,remove);area.append(row);

function neededIngredients(){let need=new Map();db.menu.filter(m=>!m.done).forEach(m=>{let r=db.recipes.find(r=>r.id===m.recipe);if(!r)return;(r.ingredients||[]).forEach(line=>{let i=parseIngredient(line),scale=m.portions/(r.portions||1),key=i.name.toLowerCase()+'|'+i.unit;let v=need.get(key)||{...i,qty:0};v.qty+=i.qty*scale;need.set(key,v)})});return [...need.values()].map(i=>{let available=db.stocks.filter(s=>s.kind==='fridge'&&s.name.toLowerCase()===i.name.toLowerCase()&&(s.unit||'unité(s)').toLowerCase()===i.unit).reduce((a,s)=>a+num(s.qty),0);return {...i,missing:Math.max(0,Math.round((i.qty-available)*100)/100)}}).filter(i=>i.missing>0)}

function finishMenu(id){let m=db.menu.find(x=>x.id===id),r=db.recipes.find(x=>x.id===m.recipe);openModal('Recette préparée',`<p>Confirmer la préparation de <strong>${esc(r.name)}</strong> ?</p><p class="muted">Les ingrédients disponibles seront déduits de ton inventaire, et la date sera ajoutée à l'historique.</p>`,()=>{(r.ingredients||[]).forEach(line=>{let i=parseIngredient(line),remaining=i.qty*m.portions/(r.portions||1);db.stocks.filter(s=>s.kind==='fridge'&&s.name.toLowerCase()===i.name.toLowerCase()&&(s.unit||'unité(s)').toLowerCase()===i.unit).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).forEach(s=>{let used=Math.min(remaining,num(s.qty));s.qty=Math.max(0,num(s.qty)-used);remaining-=used})});m.done=true;m.date=dateToday();r.history=r.history||[];r.history.push(dateToday());closeModal();update()},'Confirmer')}
const CLAY_GIFT_DEFAULT='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f9d7c8"/><stop offset="1" stop-color="#dca08e"/></linearGradient><linearGradient id="r" x2="1" y2="1"><stop stop-color="#a2d0b8"/><stop offset="1" stop-color="#4c8b77"/></linearGradient></defs><rect width="80" height="80" rx="18" fill="#f5ebe6"/><ellipse cx="40" cy="67" rx="26" ry="5" fill="#b2a9a0" opacity=".2"/><rect x="15" y="33" width="50" height="34" rx="6" fill="url(#b)"/><rect x="11" y="27" width="58" height="13" rx="5" fill="#efbcae"/><rect x="35" y="27" width="10" height="40" fill="url(#r)"/><path d="M40 27C24 26 19 16 26 13c8-4 14 7 14 14zm0 0c16-1 21-11 14-14-8-4-14 7-14 14z" fill="none" stroke="#76b39a" stroke-width="6" stroke-linecap="round"/><path d="M20 44h10" stroke="#fff" stroke-width="3" opacity=".35"/></svg>`);
function giftArt(name){
 const n=String(name||'').toLowerCase();
 const terms=[['livre','book'],['roman','book'],['bd','book'],['bracelet','jewelry'],['collier','jewelry'],['bijou','jewelry'],['bague','jewelry'],['bougie','candle'],['fleur','flower'],['plante','flower'],['écouteur','music'],['musique','music'],['jouet','toy'],['peluche','toy'],['vêtement','clothing'],['pull','clothing'],['t-shirt','clothing'],['robe','clothing'],['parfum','beauty'],['maquillage','beauty'],['crème','beauty'],['soin','beauty']];
 if(/thé|the|infusion|tisane/.test(n))return autoProductArt(name);const type=(terms.find(([k])=>n.includes(k))||[null,'gift'])[1];
 return miniArtSvg(type);
}
function giftsView(){fab('editGift()');if(!tab)tab='Toutes';let people=['Toutes',...db.people],arr=db.gifts.filter(g=>tab==='Toutes'||g.person===tab);return `<div class="row space">${tabs(people,tab,'setTab')}<button class="iconbtn" title="Ajouter une personne" onclick="newPerson()">+</button></div>${arr.map(g=>{let pic=g.photo||giftArt(g.name);return `<div class="line">${pic?`<img class="thumb" src="${pic}" alt="">`:'<span class="gift-fallback">🎁</span>'}<div class="grow" onclick="editGift('${g.id}')"><div class="name">${esc(g.name)}</div><div class="tiny">${esc(g.person)} · ${esc(g.status)} ${g.price?'· '+g.price+' €':''}</div></div><button class="iconbtn" onclick="editGift('${g.id}')">⋯</button></div>`}).join('')||blank('Ajoute une idée de cadeau.')}<details><summary>Historique des cadeaux offerts</summary>${db.gifts.filter(g=>g.status==='Offert').map(g=>`<div class="line">${esc(g.person)} · ${esc(g.name)} · ${pretty(g.given)}</div>`).join('')}</details>`}
function newPerson(){openModal('Nouvelle personne',field('name','Prénom ou nom','','text','required'),v=>{if(!db.people.includes(v.name))db.people.push(v.name);tab=v.name;closeModal();update()})}
function editGift(id){
 const g=db.gifts.find(x=>x.id===id)||{};uploadedPhoto='';
 const selected=g.person||(tab!=='Toutes'&&db.people.includes(tab)?tab:db.people[0]||'');
 const peopleOptions=`<label class="field"><span>Pour qui ?</span><select name="person" onchange="toggleGiftPerson(this.value)"><option value="">Choisir une personne</option>${db.people.map(p=>`<option value="${esc(p)}" ${p===selected?'selected':''}>${esc(p)}</option>`).join('')}<option value="__new__" ${db.people.length===0?'selected':''}>＋ Nouvelle personne</option></select></label><label class="field" id="giftNewPerson" style="${selected?'display:none':''}"><span>Nom de la nouvelle personne</span><input name="newperson" type="text" placeholder="Prénom ou nom" autocomplete="off"></label>`;
 openModal(id?'Modifier le cadeau':'Ajouter un cadeau',field('name','Cadeau',g.name||'','text','required')+peopleOptions+select('status','Statut',['Idée','Acheté','Offert'],g.status||'Idée')+numInput('price','Prix (€)',g.price||0)+field('link','Lien (facultatif)',g.link||'')+area('notes','Notes',g.notes||'')+`<label class="field"><span>Photo (facultative)</span><input type="file" accept="image/*" onchange="previewFile(this)"></label>`+(id?`<button type="button" class="softbtn" onclick="deleteGift('${id}')">Supprimer</button>`:''),v=>{
  const name=String(v.name||'').trim();let person=v.person;
  if(person==='__new__'||!db.people.length){person=String(v.newperson||'').trim();if(!person){showToast('Indique le nom de la personne');return}if(!db.people.includes(person))db.people.push(person)}
  if(!person){showToast('Choisis une personne ou crée-la');return}
  if(!name){showToast('Indique le cadeau');return}
  const values={name,person,status:v.status,price:num(v.price),link:v.link,notes:v.notes,photo:uploadedPhoto||g.photo||'',given:v.status==='Offert'?(g.given||dateToday()):''};
  if(id)Object.assign(g,values);else db.gifts.push({...values,id:uid()});
  tab=person;closeModal();update();showToast(id?'Cadeau modifié':'Cadeau ajouté');
 });
}
function toggleGiftPerson(value){let el=document.getElementById('giftNewPerson');if(el){el.style.display=value==='__new__'?'block':'none';}}
function deleteGift(id){db.gifts=db.gifts.filter(x=>x.id!==id);closeModal();update()}
function settings(){openModal('Réglages',`<h3>Couleur de l'application</h3><div class="row" style="margin:12px 0">${['#3d7165','#6488a0','#bb7f84','#b08b57','#7c9a75'].map(c=>`<button type="button" style="width:38px;height:38px;background:${c};border-radius:50%;border:2px solid white" onclick="db.theme='${c}';save();render()"></button>`).join('')}</div><h3>Sauvegardes</h3><div class="row" style="margin:12px 0;flex-wrap:wrap"><button type="button" class="softbtn" onclick="exportData()">Exporter</button><button type="button" class="softbtn" onclick="document.getElementById('importfile').click()">Importer</button><input id="importfile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></div><div class="muted">Les données sont conservées localement dans ce navigateur. Une sauvegarde régulière est recommandée.</div>`,()=>closeModal(),'Fermer')}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mon-meli-melo-sauvegarde-'+dateToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!d||!Array.isArray(d.shopping)||!Array.isArray(d.recipes))throw Error('Format non reconnu');db={...init(),...d};save();closeModal();render();showToast('Sauvegarde importée')}catch(e){showToast('Fichier de sauvegarde non reconnu')}};rd.readAsText(f)}
// Drag and drop on desktop, and touch long press on Android.
let dragKey=null,holdTimer=null,touchStart=null;
document.addEventListener('dragstart',e=>{let el=e.target.closest('.tile');if(el){dragKey=el.dataset.key;e.dataTransfer.setData('text/plain',dragKey)}});document.addEventListener('dragover',e=>{if(e.target.closest('.tile'))e.preventDefault()});document.addEventListener('drop',e=>{let el=e.target.closest('.tile');if(!el||!dragKey)return;e.preventDefault();moveTile(dragKey,el.dataset.key);dragKey=null});function moveTile(a,b){let i=db.order.indexOf(a),j=db.order.indexOf(b);if(i<0||j<0||i===j)return;db.order.splice(i,1);db.order.splice(j,0,a);update()}
document.addEventListener('touchstart',e=>{let el=e.target.closest('.tile');if(!el)return;touchStart={key:el.dataset.key,x:e.touches[0].clientX,y:e.touches[0].clientY,armed:false};clearTimeout(holdTimer);holdTimer=setTimeout(()=>{if(touchStart){touchStart.armed=true;navigator.vibrate?.(20);showToast('Glisse la carte pour la déplacer')}},450)},{passive:true});document.addEventListener('touchmove',e=>{if(!touchStart)return;let dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;if(!touchStart.armed&&(Math.abs(dx)+Math.abs(dy)>15)){clearTimeout(holdTimer);touchStart=null}} ,{passive:true});document.addEventListener('touchend',e=>{clearTimeout(holdTimer);if(!touchStart?.armed){touchStart=null;return}let target=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY)?.closest('.tile');if(target){moveTile(touchStart.key,target.dataset.key);document.addEventListener('click',blockNextClick,true)}touchStart=null},{passive:true});function blockNextClick(e){e.preventDefault();e.stopPropagation();document.removeEventListener('click',blockNextClick,true)}
document.addEventListener('focusin',e=>{if(e.target.matches('.modal input:not([type=hidden]),.modal textarea')){document.querySelector('.overlay')?.classList.add('keyboard-visible');setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),260)}});
document.addEventListener('focusout',e=>{if(e.target.closest('.modal'))setTimeout(()=>document.querySelector('.overlay')?.classList.remove('keyboard-visible'),200)});
render();

// Capture locale de courses : validation humaine obligatoire. Aucune reconnaissance IA simulée.
let shoppingPhotoURL='';
function openPhotoShopping(){
 const html=`<p class="muted">Prends une photo de tes courses. Cette première version permet de la consulter et de saisir les produits en regard. La reconnaissance automatique nécessitera la connexion d'un service d'analyse d'images.</p>
 <label style="display:block;margin:12px 0">Photo des courses<input id="shopping-camera" type="file" accept="image/*" capture="environment" style="display:block;width:100%;margin-top:8px"></label>
 <img id="shopping-preview" alt="Aperçu des courses" style="display:none;max-width:100%;max-height:270px;object-fit:contain;border-radius:15px;margin:10px auto">
 <label style="display:block;margin:12px 0">Produits (un par ligne, ex. 2 x chocolat noir)<textarea id="shopping-photo-lines" rows="7" placeholder="2 x préparation dessert chocolat noir\n1 x pâtes Barilla\n1 x lait demi-écrémé" style="width:100%;margin-top:8px"></textarea></label>
 <p class="muted" style="font-size:12px">Les éléments sont ajoutés aux placards. Tu peux ensuite modifier leur emplacement dans l'inventaire.</p>`;
 openModal('Ajouter depuis une photo',html,()=>{
  const lines=(document.getElementById('shopping-photo-lines')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length){showToast('Indique au moins un produit');return}
  let added=0;
  for(const line of lines){const match=line.match(/^(\d+(?:[.,]\d+)?)\s*[x×]\s*(.+)$/i);const qty=match?Number(match[1].replace(',','.')):1;const name=(match?match[2]:line).trim();if(!name)continue;
   const existing=db.stocks.find(x=>x.kind==='fridge'&&x.location==='Placards'&&x.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'));
   if(existing)existing.qty=Number(existing.qty||0)+qty;
   else db.stocks.push({id:uid(),kind:'fridge',name,qty,unit:'unité(s)',location:'Placards',min:null,noThreshold:true,expiry:'',barcode:''});added++;
  }
  closeModal();tab='Placards';update();showToast(added+' produit(s) ajouté(s) aux placards');
 },'Ajouter à l’inventaire');
 const input=document.getElementById('shopping-camera');
 input?.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;if(shoppingPhotoURL)URL.revokeObjectURL(shoppingPhotoURL);shoppingPhotoURL=URL.createObjectURL(file);const img=document.getElementById('shopping-preview');if(img){img.src=shoppingPhotoURL;img.style.display='block'}});
}
