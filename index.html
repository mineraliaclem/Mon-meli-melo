let _iconIdx=null;
function _buildIconIdx(){const rows=[];for(const k in ICON_ART){const ph=new Set([k.replace(/_/g,' ')]);(ICON_WORDS[k]||'').split('|').forEach(p=>{p=_norm(p);if(p)ph.add(p)});ph.forEach(p=>rows.push([p.split(' ').map(_sing).join(' '),k]))}rows.sort((a,b)=>b[0].length-a[0].length);_iconIdx=rows}
const _GENERIC=[[/savon liquide/,'savon_liquide'],[/(fil|soie) dentaire/,'fil_dentaire'],[/(shamp|apres sham|demelant)/,'shampoing'],[/(creme|lotion|baume|lait) .*(corps|mains|pieds)/,'creme_corps'],[/(creme|serum|soin|masque)/,'creme_visage'],[/(rouge|gloss|mascara|vernis|fard|maquill|eyeliner|blush|poudre)/,'maquillage'],[/(comprime|gelule|medic|doliprane|spasfon|cachet|ampoule buvable|sachet|poudre orale|suppositoire)/,'medicament'],[/(sirop)/,'sirop_toux'],[/(nettoy|detergent|entretien|desodor|lave|javel|degraiss|detart)/,'produit_menager'],[/(sac|boite|papier|film|rouleau)/,'film_alimentaire'],[/(fruit)/,'pomme'],[/(legume)/,'legumes_surgeles'],[/(viande|steak|cote|escalope)/,'boeuf'],[/(boisson|jus|nectar)/,'jus'],[/(gateau|biscuit|dessert|patisserie)/,'gateau'],[/(surgele|congele)/,'legumes_surgeles'],[/(conserve|boite)/,'tomate_concassee']];
function clayIcon(name){
 const t=_norm(name);if(!t)return null;
 if(!_iconIdx)_buildIconIdx();
 const ws=t.split(' ').map(_sing);const s=ws.join(' ');
 const padded=' '+s+' ';
 // 1) exact phrase, then phrase contained in the name (longest first)
 for(const [p,k] of _iconIdx){if(padded.includes(' '+p+' '))return CLAY_ICONS[k]}
 // 2) typo tolerance on single words (>=5 letters)
 for(const w of ws){if(w.length<5)continue;for(const [p,k] of _iconIdx){if(p.indexOf(' ')<0&&p.length>=5&&_lev(w,p)<=1)return CLAY_ICONS[k]}}
 // 3) word prefix (ex: "tomat" -> tomate)
 for(const w of ws){if(w.length<4)continue;for(const [p,k] of _iconIdx){if(p.indexOf(' ')<0&&p.length>w.length&&p.startsWith(w))return CLAY_ICONS[k]}}
 // 4) generic family hints
 for(const [re,k] of _GENERIC){if(re.test(t)&&CLAY_ICONS[k])return CLAY_ICONS[k]}
 return null;
}

function autoProductArt(name){
 const norm=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 let art='';let bg='#e7efe9';
 if(/the|infusion|tisane/.test(norm)){bg='#f4e8d9';art='<rect x="20" y="29" width="37" height="27" rx="5" fill="#fff8e9" stroke="#b89472" stroke-width="2"/><path d="M57 35q18-3 12 10q-4 8-12 5" fill="none" stroke="#b89472" stroke-width="4"/><path d="M27 28q-6-9 2-16m10 16q-5-9 2-16" fill="none" stroke="#83aa91" stroke-width="3"/><path d="M19 57h45" stroke="#b89472" stroke-width="3"/>';}
 else if(/film plastique|film alimentaire|cellophane/.test(norm)){bg='#e6eff1';art='<path d="M14 31l42-12 12 11-43 13z" fill="#d3dce0" stroke="#78949b" stroke-width="2"/><path d="M25 43v18l43-13V30" fill="#a8bcc3" stroke="#78949b" stroke-width="2"/><ellipse cx="45" cy="29" rx="7" ry="4" fill="#fff" stroke="#78949b" stroke-width="2"/>';}
 else if(/papier alu|aluminium/.test(norm)){bg='#e8eef1';art='<path d="M15 30l43-13 11 12-43 14z" fill="#e4e8ea" stroke="#899ba4" stroke-width="2"/><path d="M26 43v17l43-14V29" fill="#b7c5cd" stroke="#899ba4" stroke-width="2"/>';}
 else if(/savon|shampoing|gel douche|creme|dentifrice/.test(norm)){bg='#f5e7e6';art='<rect x="25" y="22" width="32" height="44" rx="8" fill="#9ec6b6"/><rect x="32" y="15" width="18" height="9" rx="3" fill="#527e71"/><rect x="31" y="40" width="20" height="15" rx="4" fill="#f9f2e7"/>';}
 else if(/comprime|medicament|paracetamol|doliprane|pansement/.test(norm)){bg='#e6eef5';art='<rect x="15" y="27" width="50" height="32" rx="6" fill="#fff" stroke="#8faab4" stroke-width="2"/><path d="M40 32v21M30 42h20" stroke="#78aa9b" stroke-width="6"/>';}
 else {let label=norm.trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'•';art=`<circle cx="40" cy="40" r="28" fill="#d4e4da"/><text x="40" y="50" font-family="system-ui,sans-serif" font-size="23" text-anchor="middle" fill="#477569" font-weight="700">${label}</text>`;}
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" rx="16" fill="${bg}"/>${art}</svg>`);
}

function enhanceSelects(root){(root||document).querySelectorAll('select:not(.picked)').forEach(sel=>{if(sel.closest('.pick-overlay'))return;sel.classList.add('picked');sel.tabIndex=-1;const b=document.createElement('button');b.type='button';b.className='pickbtn';b.textContent=pickLabel(sel);b.addEventListener('click',()=>openPicker(sel,b));sel.after(b);sel._btn=b});document.querySelectorAll('select.picked').forEach(s=>{if(s._btn){if(s._btn.textContent!==pickLabel(s))s._btn.textContent=pickLabel(s)}})}
function openPicker(sel,btn){const lab=sel.closest('label');let title=lab?(lab.querySelector('span')?.textContent||lab.childNodes[0]?.textContent||''):'';title=(title||'Choisir').trim();const ov=document.createElement('div');ov.className='pick-overlay';ov.innerHTML=`<div class="pick-dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div class="pick-list">${[...sel.options].map((o,i)=>`<button type="button" class="pick-opt ${i===sel.selectedIndex?'on':''}" data-i="${i}">${esc(o.text)}</button>`).join('')}</div></div>`;const close=()=>ov.remove();ov.addEventListener('click',e=>{if(e.target===ov){close();return}const b=e.target.closest('.pick-opt');if(!b)return;sel.selectedIndex=+b.dataset.i;btn.textContent=pickLabel(sel);sel.dispatchEvent(new Event('change',{bubbles:true}));close()});document.body.appendChild(ov)}

function nativeNotif(){const c=window.Capacitor;try{return c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.LocalNotifications||null}catch(e){return null}}
let _ntTimer=null;
async function regMedActions(LN){try{await LN.registerActionTypes({types:[{id:'MED',actions:[{id:'taken',title:'✓ Pris'},{id:'skip',title:'Ignoré'}]},{id:'TASK',actions:[{id:'tdone',title:'✓ Fait'},{id:'tlater',title:'Dans 1 h'}]}]})}catch(e){}}
function skipMedReminder(id){const r=(db.medReminders||[]).find(x=>x.id===id);if(!r)return;if(r.lastDone===dateToday()){showToast('Déjà pris aujourd’hui');return}r.lastSkipped=dateToday();update();showToast('Prise ignorée')}
function onMedAction(ev){try{const a=ev&&ev.actionId,x=(ev&&ev.notification&&ev.notification.extra)||{};if(x.test){showToast(a==='taken'?'Test : bouton « Pris » reçu ✓':a==='skip'?'Test : bouton « Ignoré » reçu ✓':'Test : notification ouverte');return}
 if(x.tid){const t=db.tasks.find(k=>k.id===x.tid);navigate('tasks');if(t){if(a==='tdone'){t.done=true;t.rdate='';t.rtime='';update();showToast('Tâche faite ✓')}else if(a==='tlater'){const d=new Date(Date.now()+3600000);t.rdate=ymd(d);t.rtime=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');update();showToast('Rappel repoussé d’1 h')}}return}
 if(!x.rid)return;if(a==='taken'){navigate('medrem');takeMedReminder(x.rid)}else if(a==='skip'){navigate('medrem');skipMedReminder(x.rid)}else navigate('medrem')}catch(e){}}
(function(){const LN=nativeNotif();if(LN&&LN.addListener){try{LN.addListener('localNotificationActionPerformed',onMedAction);regMedActions(LN)}catch(e){}}})();
function _hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 100000+Math.abs(h)%900000}
function scheduleNativeMeds(now){const LN=nativeNotif();if(!LN)return Promise.resolve();clearTimeout(_ntTimer);
 const run=async()=>{try{const perm=await LN.checkPermissions();if(perm.display!=='granted')return;
  try{await LN.createChannel({id:'meds',name:'Rappels médicaments',description:'Rappels de prise de médicaments',importance:5,visibility:1,vibration:true})}catch(e){}
  await regMedActions(LN);const pend=await LN.getPending();const mine=(pend.notifications||[]).filter(n=>n.id>=100000&&n.id<1000000).map(n=>({id:n.id}));if(mine.length)await LN.cancel({notifications:mine});
  const used=new Set();const list=[];
  (db.medReminders||[]).forEach(r=>{const st=db.stocks.find(x=>x.id===r.stockId);const [hh,mm]=String(r.time||'08:00').split(':');let id=_hashId(String(r.id));while(used.has(id))id++;used.add(id);
   list.push({id,title:'💊 '+(st?.name||'Médicament'),body:(r.dose||1)+' '+(st?.unit||'unité(s)')+' à prendre maintenant',channelId:'meds',smallIcon:'ic_stat_pill',iconColor:'#3D7165',actionTypeId:'MED',extra:{rid:r.id},schedule:{on:{hour:+hh||0,minute:+mm||0},allowWhileIdle:true}})});
  if(list.length)await LN.schedule({notifications:list})}catch(e){window._ntErr=String(e&&e.message||e)}};
 if(now)return run();_ntTimer=setTimeout(run,800);return Promise.resolve()}
let _tkTimer=null;
function scheduleNativeTasks(ask){const LN=nativeNotif();if(!LN)return;clearTimeout(_tkTimer);
 _tkTimer=setTimeout(async()=>{try{let perm=await LN.checkPermissions();if(perm.display!=='granted'&&ask)perm=await LN.requestPermissions();if(perm.display!=='granted')return;
  try{await LN.createChannel({id:'tasks',name:'Rappels de tâches',description:'Rappels pour les tâches à faire',importance:4,visibility:1,vibration:true})}catch(e){}
  await regMedActions(LN);const pend=await LN.getPending();const mine=(pend.notifications||[]).filter(n=>n.id>=1000000).map(n=>({id:n.id}));if(mine.length)await LN.cancel({notifications:mine});
  const used=new Set(),list=[],now=Date.now();
  (db.tasks||[]).forEach(t=>{if(t.done||!t.rdate)return;const [hh,mm]=String(t.rtime||'09:00').split(':');const at=new Date(t.rdate+'T'+String(hh).padStart(2,'0')+':'+String(mm||'00').padStart(2,'0')+':00');if(isNaN(at)||at.getTime()<=now+5000)return;
   let id=1000000+_hashId(String(t.id))%900000;while(used.has(id))id++;used.add(id);
   list.push({id,title:'✅ '+t.name,body:t.priority==='Haute'?'Tâche prioritaire à faire':'Une tâche à faire',channelId:'tasks',smallIcon:'ic_stat_task',iconColor:'#3D7165',actionTypeId:'TASK',extra:{tid:t.id},schedule:{at,allowWhileIdle:true}})});
  if(list.length)await LN.schedule({notifications:list})}catch(e){window._ntErr=String(e&&e.message||e)}},600)}
function enableMedNotifications(){

  try{const ex=await LN.checkExactNotificationSetting();if(ex&&ex.exact_alarm==='denied')await LN.changeExactNotificationSetting()}catch(e){}
  await scheduleNativeMeds(true);showToast('Rappels activés, même appli fermée')}catch(e){showToast('Activation impossible')}})();return}

  const prompt='Tu aides à remplir un inventaire domestique (cuisine, salle de bain, ménage, pharmacie). Voici ce que la personne a dit ou écrit, parfois en vrac, sans ponctuation ou avec des fautes de dictée vocale : « '+String(text).replace(/[«»]/g,'')+' ». Transforme-le en liste de produits. Réponds UNIQUEMENT par un tableau JSON sans texte autour, de la forme [{"name":"yaourts","qty":4,"unit":"unité(s)","dest":"Frigo"}]. Règles : name = nom courant en français, sans marque, avec majuscule initiale ; qty = nombre (1 si non précisé) ; unit = "unité(s)" pour ce qui se compte (pots, paquets, boîtes, bouteilles, pièces), sinon "g", "kg", "ml" ou "L" si une masse ou un volume est dit ; dest = exactement une de : "Frigo" (produits frais, laitages, viande, poisson, légumes frais), "Congélateur" (surgelés, glaces), "Placards" (épicerie sèche, conserves, boissons, pain), "beauty" (hygiène, soins, maquillage), "house" (produits ménagers, papier toilette, éponges, lessive), "meds" (médicaments, pansements, pharmacie). Un élément par produit, ne fusionne pas des produits différents.';
  const data=await sample.json(prompt,{modelTier:'quick',cache:false});
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:[]);
  items=arr.filter(x=>x&&x.name).slice(0,40).map(x=>({on:true,name:String(x.name).trim(),qty:String(Number(x.qty)||1).replace('.',','),unit:U.includes(x.unit)?x.unit:'unité(s)',dest:D.includes(x.dest)?x.dest:guessStore(String(x.name))}))}}catch(e){items=null}

 _photoItems=items;st.textContent=items.length+' produit(s) repéré(s)'+note+' — vérifie le rangement, corrige si besoin, puis ajoute.';photoRender()}
function addStockTo(dest,name,qty,unit){const isFood=['Frigo','Congélateur','Placards'].includes(dest);const kind=isFood?'fridge':dest;
 const old=db.stocks.find(x=>x.kind===kind&&(!isFood||x.location===dest)&&String(x.name).toLowerCase()===String(name).toLowerCase()&&(x.unit||'unité(s)')===unit);
 if(old)old.qty=num(old.qty)+qty;else{const o={id:uid(),kind,name,qty,unit,min:null,noThreshold:true,expiry:'',barcode:''};if(isFood)o.location=dest;if(CAT_KINDS.includes(kind))o.cat=catGuess(kind,name);db.stocks.push(o)}}
