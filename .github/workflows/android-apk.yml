name: Fabriquer l'appli Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'www/**'
      - 'android-res/**'
      - 'android-signing/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android && npx cap sync android
      - name: Permissions et icône
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' $M
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os,shutil
          src=Image.open('icon-maskable.png').convert('RGBA')
          core=src.crop((59,64,454,446))
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26',ignore_errors=True)
          os.makedirs(res+'/mipmap-anydpi-v26',exist_ok=True)
          open(res+'/mipmap-anydpi-v26/ic_launcher.xml','w').write('<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_bg"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          shutil.copy(res+'/mipmap-anydpi-v26/ic_launcher.xml',res+'/mipmap-anydpi-v26/ic_launcher_round.xml')
          open(res+'/values/ic_launcher_bg.xml','w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_bg">#FDF9F4</color></resources>')
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=f'{res}/mipmap-{d}'
              os.makedirs(p,exist_ok=True)
              im=src.resize((s,s),Image.LANCZOS)
              for n in ('ic_launcher.png','ic_launcher_round.png'):
                  im.save(f'{p}/{n}')
              f=int(s*108/48)
              fg=Image.new('RGBA',(f,f),(0,0,0,0))
              k=int(f*0.60)
              c=core.resize((k,int(k*core.height/core.width)),Image.LANCZOS)
              fg.paste(c,((f-c.width)//2,(f-c.height)//2),c)
              fg.save(f'{p}/ic_launcher_foreground.png')
          PY
      - name: Icône de notification
        run: cp -r android-res/. android/app/src/main/res/
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mon-meli-melo.apk
      - name: Publier le fichier à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Mon méli-mélo (Android)
          body: Dernière version de l'appli Android. Télécharge Mon-meli-melo.apk et ouvre-le sur ton téléphone.
          files: Mon-meli-melo.apk
          make_latest: true
