name: Fabriquer APK Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les outils
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Compiler APK de test
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-meli-melo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
